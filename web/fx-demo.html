<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Overlay test page</title>
<!-- For building and checking overlays without a tablet or a house. Open from the file system.
     Address parameters, for screenshots: ?kind=frost,fireflies&p=0.6&night=1&weather=snowy&temp=20&month=10&on=1,4&w=1024&h=768&opt=count:30;always:1&t=5
     (p = point in the growth cycle 0..1; temp in Fahrenheit; date=2026-12-24 sets the day; opt = options for the first kind; t = seconds to let it run before "ready") -->
<style>
  html, body { margin: 0; background: #05060f; color: #cfd6ee; font: 13px system-ui, sans-serif; }
  #stage { position: relative; background: linear-gradient(180deg, #1b1f5e, #42207a 55%, #a03a6e); overflow: hidden; }
  .b { position: absolute; box-sizing: border-box; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 10px 12px; font-weight: 600; }
  .b.on { background: linear-gradient(155deg, rgba(255,222,140,.92), rgba(255,142,66,.86)); color: #2b1400; }
  #fx { position: absolute !important; }
  #panel { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  #panel label { display: flex; gap: 6px; align-items: center; }
  select, input, button { font: inherit; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <label>Overlay <select id="kind" multiple size="5"></select></label>
  <label>Growth <input id="p" type="range" min="0" max="1" step="0.01" value="0.6"><span id="pv"></span></label>
  <label><input id="night" type="checkbox"> Night</label>
  <label>Weather <select id="weather"><option>sunny</option><option>cloudy</option><option>rainy</option><option>pouring</option><option>snowy</option><option>clear-night</option><option>fog</option><option>lightning</option><option>windy</option></select></label>
  <label>Temp °F <input id="temp" type="number" value="60" style="width:60px"></label>
  <label>Month <input id="month" type="number" min="1" max="12" value="6" style="width:50px"></label>
  <button id="press">Press a button</button>
  <span id="fps"></span> <span id="note"></span>
</div>
<script>
// Headless Chrome with a virtual time budget runs only one animation frame. For screenshots (a "t" in the address)
// frames are driven by a timer instead, so live overlays really run for t seconds.
if (new URLSearchParams(location.search).has('t')) { window.requestAnimationFrame = f => setTimeout(() => f(performance.now()), 16); window.cancelAnimationFrame = clearTimeout; }
</script>
<script src="fx.js"></script>
<script src="fx-basic.js"></script>
<script src="fx-plants.js" onerror="0"></script>
<script src="fx-weather.js" onerror="0"></script>
<script src="fx-growth.js" onerror="0"></script>
<script src="fx-gaps.js" onerror="0"></script>
<script src="fx-critters.js" onerror="0"></script>
<script src="fx-lava.js" onerror="0"></script>
<script src="fx-goose.js" onerror="0"></script>
<script src="fx-stick.js" onerror="0"></script>
<script src="fx-tanks.js" onerror="0"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search), W = +q.get('w') || 1024, H = +q.get('h') || 768, $ = id => document.getElementById(id);
const stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
// a dashboard like the real ones: a clock area (no button), a row of four, a row of six, two rows of five, one tall
const cells = [[26, 2, 18, 6], [26, 8, 18, 6], [44, 2, 18, 12], [2, 15, 14, 6], [16, 15, 15, 6], [31, 15, 16, 6], [47, 15, 15, 6],
  [2, 22, 10, 8], [12, 22, 10, 8], [22, 22, 10, 8], [32, 22, 10, 8], [42, 22, 10, 8], [52, 22, 10, 8],
  [2, 31, 12, 8], [14, 31, 12, 8], [26, 31, 12, 8], [38, 31, 12, 16], [50, 31, 12, 8], [2, 39, 12, 8], [14, 39, 12, 8], [26, 39, 12, 8], [50, 39, 12, 8]];
const on = new Set((q.get('on') || '1,9,16').split(',').filter(Boolean).map(Number));
const rects = cells.map((c, i) => { const g = 5, r = {x: c[0] / 64 * W + g, y: c[1] / 48 * H + g, w: c[2] / 64 * W - 2 * g, h: c[3] / 48 * H - 2 * g, r: 22, on: on.has(i), type: 'entity', tile: {type: 'entity', entity: 'light.demo' + i, name: 'Button ' + (i + 1)}};
  const d = document.createElement('div'); d.className = 'b' + (r.on ? ' on' : ''); d.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-radius:${r.r}px`; d.textContent = 'Button ' + (i + 1); stage.append(d); r.el = d; return r; });
const fx = document.createElement('div'); fx.id = 'fx'; stage.append(fx);
// the engine sizes itself from the window; on this page the stage is the "screen"
Object.defineProperty(window, 'innerWidth', {get: () => W}); Object.defineProperty(window, 'innerHeight', {get: () => H});

Object.keys(HP.fx.kinds).forEach(k => $('kind').append(new Option(HP.fx.kinds[k].label || k, k)));
const want = (q.get('kind') || 'frost').split(',');
[...$('kind').options].forEach(o => { o.selected = want.includes(o.value); });
if (q.has('p')) $('p').value = q.get('p');
$('night').checked = q.get('night') === '1'; if (q.has('weather')) $('weather').value = q.get('weather');
if (q.has('temp')) $('temp').value = q.get('temp'); if (q.has('month')) $('month').value = q.get('month');
const opt = {}; (q.get('opt') || '').split(';').filter(Boolean).forEach(kv => { const [k, v] = kv.split(':'); opt[k] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; });
function apply() {
  const temp = +$('temp').value;
  HP.fx.env({night: $('night').checked, elevation: $('night').checked ? -20 : 40, weather: $('weather').value, temp, freezing: 32, cold: temp <= 32, month: +$('month').value, date: q.has('date') ? new Date(q.get('date') + 'T12:00:00') : new Date()});
  const sel = [...$('kind').selectedOptions], first = sel.some(o => o.value === want[0]) ? want[0] : sel[0] && sel[0].value;  // opt goes to the kind named first in the address
  const list = sel.map(o => Object.assign({kind: o.value}, o.value === first ? opt : {}));
  HP.fx.layout(rects); HP.fx.use(list, 'demo/one', false, ['demo/one', 'demo/two']); HP.fx.preview(+$('p').value); $('pv').textContent = Math.round($('p').value * 100) + '%';
}
['kind', 'night', 'weather', 'temp', 'month'].forEach(id => $(id).addEventListener('change', apply));
$('p').addEventListener('input', () => { HP.fx.preview(+$('p').value); $('pv').textContent = Math.round($('p').value * 100) + '%'; });
$('press').onclick = () => HP.fx.press(Math.floor(Math.random() * rects.length));
if (q.has('demo')) HP.fx.demo = true;  // as in the Studio's Preview: kinds that wait start at once
// for checks: steal=tile,second hides a tile's element the way a goose does; script errors are written into the page
window.addEventListener('error', e => { $('note').textContent += ' ERR ' + e.message; });
{ const o = console.error; console.error = (...m) => { $('note').textContent += ' ERR ' + m.join(' '); o.apply(console, m); }; }
if (q.has('steal')) { const [i, at, back] = q.get('steal').split(',').map(Number); setTimeout(() => { rects[i].el.style.visibility = 'hidden'; }, at * 1000); if (back) setTimeout(() => { rects[i].el.style.visibility = ''; }, back * 1000); }
apply();
// sculpt=1: every snow sculpture of the snow crew and its motorhome, side by side at double size, for a look
if (q.has('sculpt') && HP.fx.stickTest && HP.fx.stickTest.sculpt) { const c = document.createElement('canvas'); c.width = W; c.height = H; c.style.cssText = 'position:absolute;left:0;top:0;background:#3a2a6e'; stage.append(c); const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  for (let i = 0; i < 9; i++) g.drawImage(HP.fx.stickTest.sculpt(i, 9, true), 10 + (i % 3) * 340, 10 + Math.floor(i / 3) * 190, 324, 180); g.drawImage(HP.fx.stickTest.rv(), 20, 585, 424, 192); g.drawImage(HP.fx.stickTest.sculpt(0, 6, false), 600, 580, 324, 180); }
// snap=counter,seconds[,zoom]: freeze the picture (and with a zoom, enlarge it around the activity) that many seconds after HP.fx.stickTest[counter] first counts (to photograph one moment)
if (q.has('snap')) { const [k, d, z] = q.get('snap').split(','), iv = setInterval(() => { if (HP.fx.stickTest && HP.fx.stickTest[k]) { clearInterval(iv); setTimeout(() => { window.requestAnimationFrame = () => 0; const T = HP.fx.stickTest; if (+z) { stage.style.transformOrigin = '0 0'; stage.style.transform = `translate(${W / 2 - (/^(gifts|unwraps|opens|open_)/.test(k) ? T.gx : T.ax) * z}px,${H / 2 - ((/^(gifts|unwraps|opens|open_)/.test(k) ? T.gy : T.ay) - 20) * z}px) scale(${z})`; } }, (+d || 0) * 1000); } }, 40); }
// poke=seconds: a finger comes down somewhere every so often; swipe=seconds: the screen is yanked sideways every so often
if (q.has('poke')) setInterval(() => document.dispatchEvent(new PointerEvent('pointerdown', {clientX: Math.random() * W, clientY: Math.random() * H, bubbles: true})), +q.get('poke') * 1000);
if (q.has('swipe')) setInterval(() => HP.fx.swipe(Math.random() < 0.5 ? -1 : 1), +q.get('swipe') * 1000);
// wx=60:sunny,240:snowy: the weather changes at those seconds (the overlays are not rebuilt, as in the house)
if (q.has('wx')) q.get('wx').split(',').forEach(e => { const [at, w] = e.split(':'); setTimeout(() => { $('weather').value = w; HP.fx.env({weather: w}); }, +at * 1000); });
// frames per second of the live layer, measured from the page's own animation clock
let n = 0, t0 = performance.now(); const raf = () => { n++; const t = performance.now(); if (t - t0 > 1000) { $('fps').textContent = 'page ' + n + ' fps'; n = 0; t0 = t; } requestAnimationFrame(raf); }; raf();
setTimeout(() => { for (const k of ['stickTest', 'walkTest']) if (HP.fx[k] && want.some(w => k === 'walkTest' ? w === 'walkers' : w !== 'walkers')) $('note').textContent += ' ' + JSON.stringify(HP.fx[k]); }, (+q.get('t') || 1) * 1000 - 300);
// dbg=seconds: every so often, where the walkers are and what they are doing (door, hatch, states, levels against the door)
if (q.has('dbg')) setInterval(() => { const W = HP.fx.walkTest && HP.fx.walkTest.W; if (!W) return; const st = {}, lv = {}; for (const c of W.list) { st[c.st] = (st[c.st] || 0) + 1; const k = Math.round(c.y / 10) * 10 + (c.y - W.door.y > 10 ? 'b' : c.y - W.door.y < -10 ? 'a' : '='); lv[k] = (lv[k] || 0) + 1; } $('note').textContent += ' | t' + Math.round(W.t) + ' r' + HP.fx.walkTest.round + ' door ' + Math.round(W.door.x) + ',' + W.door.y + ' hatch ' + Math.round(W.hatch.x) + ',' + Math.round(W.hatch.y) + ' home ' + HP.fx.walkTest.home + ' splat ' + HP.fx.walkTest.splat + ' (' + HP.fx.walkTest.last + ') left ' + W.left + ' ' + JSON.stringify(st) + JSON.stringify(lv) + ' [' + W.list.filter(c => !c.s.solid).slice(0, 6).map(c => Math.round(c.x) + ',' + Math.round(c.y) + (c.dir > 0 ? '>' : '<') + c.role[0] + c.st).join(' ') + ']' + (W.lead && !W.lead.dead ? ' lead ' + W.lead.st + '@' + Math.round(W.lead.x) + ',' + Math.round(W.lead.y) : ''); }, +q.get('dbg') * 1000);
setTimeout(() => { document.title = 'ready'; }, (+q.get('t') || 1) * 1000);
</script>
</body>
</html>
