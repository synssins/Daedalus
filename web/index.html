<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HomePanel</title>
<style>
  /* Look copied from the HA Master dashboard: dark for evening rooms, one accent = "on". */
  :root { --bg: #14181c; --panel: #1e2429; --line: #2c343b; --text: #eef0ee; --muted: #9ba5ab;
    --on: #f0b95a; --on-bg: rgba(240,185,90,.15); --on-line: rgba(240,185,90,.45);
    --warn: #f29d49; --warn-bg: rgba(242,157,73,.15); --warn-line: rgba(242,157,73,.5);
    --alert: #ff7468; --alert-bg: rgba(255,116,104,.16); --alert-line: rgba(255,116,104,.55); --ok: #86c79a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 18px -apple-system, Helvetica, sans-serif; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; }

  #nav { flex: none; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-bottom: 1px solid var(--line); }
  #nav .title { flex: 1; font-size: 22px; font-weight: 600; }
  .nb { padding: 9px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .nb.cur { color: var(--text); border-color: var(--muted); }
  .nb.back, .nb.go { color: var(--text); }
  .nb.go { background: var(--on-bg); border-color: var(--on-line); }
  #bar { flex: none; padding: 8px 16px; font-size: 16px; background: var(--alert-bg); color: var(--alert); }
  #bar:empty { display: none; }
  #main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .page { padding: 4px 16px 24px; }
  h2 { margin: 18px 2px 8px; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .t { min-height: 74px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .t.wide { grid-column: span 2; }
  .t .n { font-size: 19px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t .l { margin-top: 3px; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
  .t[data-act]:active { opacity: .6; }
  .t.on { background: var(--on-bg); border-color: var(--on-line); } .t.on .l { color: var(--on); }
  .t.warn { background: var(--warn-bg); border-color: var(--warn-line); } .t.warn .l { color: var(--warn); }
  .t.alert { background: var(--alert-bg); border-color: var(--alert-line); } .t.alert .l { color: var(--alert); }
  .t.ok .n { color: var(--ok); }
  .t.off .n, .t.off .l { color: #6a747b; }
  .empty { padding: 60px 0; text-align: center; color: var(--muted); }

  #wall { height: 100%; box-sizing: border-box; padding: 6px; display: grid; gap: 6px;
    grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; }
  #wall.one { grid-template-columns: 1fr; }
  #wall .empty { grid-column: 1 / -1; }
  .cam { position: relative; background: #0c0f12; border-radius: 8px; overflow: hidden; min-height: 0; }
  .cam img, .cam video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; }
  .cam img:not([src]) { display: none; }
  .cam video { visibility: hidden; }
  .cam.live video { visibility: visible; background: #000; }
  .cam .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 12px 8px; font-size: 16px; font-weight: 600;
    background: linear-gradient(transparent, rgba(0,0,0,.8)); }

  #modal { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 9; background: rgba(0,0,0,.6);
    align-items: center; justify-content: center; }
  #modal.open { display: flex; }
  #modal .box { width: 440px; padding: 26px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  #modal .q { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
  #modal .row { display: flex; justify-content: flex-end; gap: 12px; }
  #modal .nb { padding: 13px 28px; font-size: 19px; }
  #build { position: fixed; right: 6px; bottom: 2px; z-index: 3; font-size: 10px; color: #3d474e; }
</style>
</head>
<body>
<div id="nav"></div>
<div id="bar"></div>
<div id="main"></div>
<div id="modal"></div>
<div id="build"><!--BUILD--></div>
<script src="app.js"></script>
<script src="views.js"></script>
</body>
</html>
