<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HomePanel</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0f12; color: #e8edf2; overflow: hidden;
    font: 18px -apple-system, Helvetica, sans-serif; -webkit-user-select: none; -webkit-touch-callout: none; }
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; padding: 8px 16px; font-size: 16px;
    background: #7a2e35; }
  #bar:empty { display: none; }
  #wall { height: 100%; box-sizing: border-box; padding: 6px; display: grid; gap: 6px;
    grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
  #wall.one { grid-template-columns: 1fr; }
  .tile { position: relative; background: #161b21; border-radius: 8px; overflow: hidden; min-height: 0; }
  .tile video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .tile.dead video { visibility: hidden; }
  .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; font-weight: 600;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  .tile.dead .label { top: 0; display: flex; align-items: center; justify-content: center;
    background: none; color: #8a97a5; font-weight: 500; text-align: center; }
  .empty { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: #8a97a5; }
  #build { position: fixed; right: 8px; top: 4px; z-index: 3; font-size: 11px; color: #4a5561; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="build"><!--BUILD--></div>
<div id="wall"></div>
<script src="app.js"></script>
</body>
</html>
