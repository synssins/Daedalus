name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HomePanel
          path: build/HomePanel.app.tar.gz
          retention-days: 7
