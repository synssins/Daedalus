<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Overlay test page</title>
<!-- For building and checking overlays without a tablet or a house. Open from the file system.
     Address parameters, for screenshots: ?kind=frost,fireflies&p=0.6&night=1&weather=snowy&temp=20&month=10&on=1,4&w=1024&h=768&opt=count:30;always:1&t=5
     (p = point in the growth cycle 0..1; temp in Fahrenheit; opt = options for the first kind; t = seconds to let it run before "ready") -->
<style>
  html, body { margin: 0; background: #05060f; color: #cfd6ee; font: 13px system-ui, sans-serif; }
  #stage { position: relative; background: linear-gradient(180deg, #1b1f5e, #42207a 55%, #a03a6e); overflow: hidden; }
  .b { position: absolute; box-sizing: border-box; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 10px 12px; font-weight: 600; }
  .b.on { background: linear-gradient(155deg, rgba(255,222,140,.92), rgba(255,142,66,.86)); color: #2b1400; }
  #fx { position: absolute !important; }
  #panel { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  #panel label { display: flex; gap: 6px; align-items: center; }
  select, input, button { font: inherit; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <label>Overlay <select id="kind" multiple size="5"></select></label>
  <label>Growth <input id="p" type="range" min="0" max="1" step="0.01" value="0.6"><span id="pv"></span></label>
  <label><input id="night" type="checkbox"> Night</label>
  <label>Weather <select id="weather"><option>sunny</option><option>cloudy</option><option>rainy</option><option>pouring</option><option>snowy</option><option>clear-night</option><option>fog</option><option>lightning</option><option>windy</option></select></label>
  <label>Temp °F <input id="temp" type="number" value="60" style="width:60px"></label>
  <label>Month <input id="month" type="number" min="1" max="12" value="6" style="width:50px"></label>
  <button id="press">Press a button</button>
  <span id="fps"></span>
</div>
<script src="fx.js"></script>
<script src="fx-basic.js"></script>
<script src="fx-plants.js" onerror="0"></script>
<script src="fx-weather.js" onerror="0"></script>
<script src="fx-growth.js" onerror="0"></script>
<script src="fx-gaps.js" onerror="0"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search), W = +q.get('w') || 1024, H = +q.get('h') || 768, $ = id => document.getElementById(id);
const stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
// a dashboard like the real ones: a clock area (no button), a row of four, a row of six, two rows of five, one tall
const cells = [[26, 2, 18, 6], [26, 8, 18, 6], [44, 2, 18, 12], [2, 15, 14, 6], [16, 15, 15, 6], [31, 15, 16, 6], [47, 15, 15, 6],
  [2, 22, 10, 8], [12, 22, 10, 8], [22, 22, 10, 8], [32, 22, 10, 8], [42, 22, 10, 8], [52, 22, 10, 8],
  [2, 31, 12, 8], [14, 31, 12, 8], [26, 31, 12, 8], [38, 31, 12, 16], [50, 31, 12, 8], [2, 39, 12, 8], [14, 39, 12, 8], [26, 39, 12, 8], [50, 39, 12, 8]];
const on = new Set((q.get('on') || '1,9,16').split(',').filter(Boolean).map(Number));
const rects = cells.map((c, i) => { const g = 5, r = {x: c[0] / 64 * W + g, y: c[1] / 48 * H + g, w: c[2] / 64 * W - 2 * g, h: c[3] / 48 * H - 2 * g, r: 22, on: on.has(i), type: 'entity'};
  const d = document.createElement('div'); d.className = 'b' + (r.on ? ' on' : ''); d.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;border-radius:${r.r}px`; d.textContent = 'Button ' + (i + 1); stage.append(d); return r; });
const fx = document.createElement('div'); fx.id = 'fx'; stage.append(fx);
// the engine sizes itself from the window; on this page the stage is the "screen"
Object.defineProperty(window, 'innerWidth', {get: () => W}); Object.defineProperty(window, 'innerHeight', {get: () => H});

Object.keys(HP.fx.kinds).forEach(k => $('kind').append(new Option(HP.fx.kinds[k].label || k, k)));
const want = (q.get('kind') || 'frost').split(',');
[...$('kind').options].forEach(o => { o.selected = want.includes(o.value); });
if (q.has('p')) $('p').value = q.get('p');
$('night').checked = q.get('night') === '1'; if (q.has('weather')) $('weather').value = q.get('weather');
if (q.has('temp')) $('temp').value = q.get('temp'); if (q.has('month')) $('month').value = q.get('month');
const opt = {}; (q.get('opt') || '').split(';').filter(Boolean).forEach(kv => { const [k, v] = kv.split(':'); opt[k] = v === 'true' ? true : v === 'false' ? false : isNaN(+v) ? v : +v; });
function apply() {
  const temp = +$('temp').value;
  HP.fx.env({night: $('night').checked, elevation: $('night').checked ? -20 : 40, weather: $('weather').value, temp, freezing: 32, cold: temp <= 32, month: +$('month').value, date: new Date()});
  const list = [...$('kind').selectedOptions].map((o, i) => Object.assign({kind: o.value}, i === 0 ? opt : {}));
  HP.fx.layout(rects); HP.fx.use(list, 'demo'); HP.fx.preview(+$('p').value); $('pv').textContent = Math.round($('p').value * 100) + '%';
}
['kind', 'night', 'weather', 'temp', 'month'].forEach(id => $(id).addEventListener('change', apply));
$('p').addEventListener('input', () => { HP.fx.preview(+$('p').value); $('pv').textContent = Math.round($('p').value * 100) + '%'; });
$('press').onclick = () => HP.fx.press(Math.floor(Math.random() * rects.length));
apply();
// frames per second of the live layer, measured from the page's own animation clock
let n = 0, t0 = performance.now(); const raf = () => { n++; const t = performance.now(); if (t - t0 > 1000) { $('fps').textContent = 'page ' + n + ' fps'; n = 0; t0 = t; } requestAnimationFrame(raf); }; raf();
setTimeout(() => { document.title = 'ready'; }, (+q.get('t') || 1) * 1000);
</script>
</body>
</html>
